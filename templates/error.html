{% extends "base.html" %}

{% block title %}
{{ title }}
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow-lg border-0">

            <div class="card-body text-center p-5">

                <h1 class="display-4 text-danger">
                    {{ title }}
                </h1>

                <p class="lead mt-3">
                    {{ message }}
                </p>

                <a
                    href="/"
                    class="btn btn-primary mt-3"
                >
                    Return Home
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
